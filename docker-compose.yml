services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chitthi
      POSTGRES_USER: chitthi
      POSTGRES_PASSWORD: chitthi
    ports:
      - "55432:5432"
    volumes:
      - chitthi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitthi -d chitthi"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: chitthi
      RABBITMQ_DEFAULT_PASS: chitthi
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LocalStack's S3 service stands in for object storage. MinIO stopped
  # publishing free images to both Docker Hub and quay.io in September 2026
  # (quay.io now gates them behind paid AIStor auth), leaving no free image
  # to run locally - ObjectStorageService talks to this the same way, since
  # the MinIO Java client speaks the generic S3 API rather than anything
  # MinIO-specific.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"   # S3 API (and every other enabled service) on one edge port
    volumes:
      - chitthi-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chitthi-postgres-data:
  chitthi-localstack-data:
