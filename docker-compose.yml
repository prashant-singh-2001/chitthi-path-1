services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chitthi
      POSTGRES_USER: chitthi
      POSTGRES_PASSWORD: chitthi
    ports:
      - "55432:5432"
    volumes:
      - chitthi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitthi -d chitthi"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: chitthi
      RABBITMQ_DEFAULT_PASS: chitthi
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LocalStack's S3 service stands in for object storage. MinIO stopped
  # publishing free images to both Docker Hub and quay.io in September 2026
  # (quay.io now gates them behind paid AIStor auth), leaving no free image
  # to run locally - ObjectStorageService talks to this the same way, since
  # the MinIO Java client speaks the generic S3 API rather than anything
  # MinIO-specific.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"   # S3 API (and every other enabled service) on one edge port
    volumes:
      - chitthi-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - chitthi-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Linux Docker has no host.docker.internal by default - Docker Desktop
      # (Mac/Windows) already provides it. The app itself runs outside
      # Docker (mvn spring-boot:run), so Prometheus scrapes it via the host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - chitthi-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  chitthi-postgres-data:
  chitthi-localstack-data:
  chitthi-prometheus-data:
  chitthi-grafana-data:
