services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chitthi
      POSTGRES_USER: chitthi
      POSTGRES_PASSWORD: chitthi
    ports:
      - "55432:5432"
    volumes:
      - chitthi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitthi -d chitthi"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: chitthi
      RABBITMQ_DEFAULT_PASS: chitthi
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chitthi
      MINIO_ROOT_PASSWORD: chitthi123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - chitthi-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chitthi-postgres-data:
  chitthi-minio-data:
