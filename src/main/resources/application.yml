spring:
  application:
    name: chitthi

  servlet:
    multipart:
      # FR1's 20 MB-per-file limit is unreachable against Boot's 1 MB/10 MB
      # defaults; max-request-size covers a 30-image batch upload.
      max-file-size: 20MB
      max-request-size: 64MB

  datasource:
    url: jdbc:postgresql://localhost:55432/chitthi
    username: chitthi
    password: chitthi

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: chitthi
    password: chitthi

minio:
  endpoint: http://localhost:9000
  access-key: chitthi
  secret-key: chitthi123
  bucket: chitthi-documents

sarvam:
  base-url: https://api.sarvam.ai
  api-subscription-key: ${SARVAM_API_KEY:changeme}
  rate-limits:
    vision-requests-per-minute: 10
  pipeline:
    ocr-max-pages-per-chunk: 10
    translate-max-chars-per-request: 2000
    tts-max-chars-per-request: 2500
    concurrency: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
