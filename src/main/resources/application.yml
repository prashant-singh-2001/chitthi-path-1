spring:
  application:
    name: chitthi

  servlet:
    multipart:
      # FR1's 20 MB-per-file limit is unreachable against Boot's 1 MB/10 MB
      # defaults; max-request-size covers a 30-image batch upload.
      max-file-size: 20MB
      max-request-size: 64MB

  datasource:
    url: jdbc:postgresql://localhost:55432/chitthi
    username: chitthi
    password: chitthi

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: chitthi
    password: chitthi
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s

minio:
  # Points at the LocalStack S3 service in docker-compose.yml (see there for
  # why - MinIO's own images are no longer freely pullable). The MinIO Java
  # client works against it unchanged, since it speaks the generic S3 API.
  endpoint: http://localhost:4566
  access-key: test
  secret-key: test
  bucket: chitthi-documents
  region: us-east-1

chitthi:
  ocr:
    worker:
      enabled: true
      # Two consumers at prefetch 1: fairness across batches matters more
      # than throughput, since a submit is a slow, expensive paid call.
      concurrency: 2
      max-concurrency: 4
    poller:
      enabled: true
      # Plain milliseconds, not "1s": @Scheduled's fixedDelayString only
      # accepts a bare long or an ISO-8601 duration, not the shorthand
      # @ConfigurationProperties binding elsewhere in this file understands.
      sweep-interval-ms: 1000
      claim-batch-size: 20
    poll:
      # Sarvam's status endpoint is async; 5s matches the requirements doc's
      # stated starting interval. Capped growth with jitter keeps multiple
      # batches from a multi-chunk document polling in lockstep forever.
      initial-delay: 5s
      multiplier: 1.5
      max-delay: 60s
      jitter-ratio: 0.2
      max-attempts: 30
    dispatch:
      # How long a freshly created batch waits before the poller's
      # redispatch sweep assumes its after-commit publish never happened.
      lease: 60s
      max-submit-attempts: 3
    max-payload-bytes: 33554432
    result:
      max-unzipped-bytes: 33554432
      # The Digitise output's per-page text field name isn't pinned by the
      # docs (see PageTextExtractor). Adding a name here needs no code
      # change - see SarvamDigitiseSmokeTest for how to find the real one.
      text-fields: [markdown, md, text, content, page_content, extracted_text, output]
  translate:
    worker:
      enabled: true
  tts:
    worker:
      enabled: true
  assemble:
    worker:
      enabled: true
  audio:
    url-ttl: 15m

sarvam:
  base-url: https://api.sarvam.ai
  api-subscription-key: ${SARVAM_API_KEY:changeme}
  rate-limits:
    vision-requests-per-minute: 10
  pipeline:
    ocr-max-pages-per-chunk: 10
    translate-max-chars-per-request: 2000
    tts-max-chars-per-request: 2500
    concurrency: 5
  translate:
    model: sarvam-translate:v1
  tts:
    model: bulbul:v3
    speaker: shubh
    sample-rate: 22050

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
